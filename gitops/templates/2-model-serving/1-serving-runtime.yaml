{{- if .Values.modelServing.enabled }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu-runtime
  namespace: {{ .Values.modelServing.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "35"
    argocd.argoproj.io/sync-options: SkipDryRun=true
  labels:
    app.kubernetes.io/part-of: openshift-ai-ref
    app.kubernetes.io/managed-by: Helm
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-2.22-cuda
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port"
        - "8080"
        - "--model"
        - "/mnt/models"
        - "--served-model-name"
        - "{{ .Values.modelServing.model.name }}"
        - "--device"
        - "cpu"
        - "--dtype"
        - "float32"
        - "--max-model-len"
        - "1024"
        - "--enforce-eager"
      env:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: {{ .Values.modelServing.vllm.kvCacheSpace | quote }}
        - name: VLLM_ENABLE_V1_MULTIPROCESSING
          value: "0"
        - name: OMP_NUM_THREADS
          value: {{ .Values.modelServing.resources.requests.cpu | quote }}
        - name: HF_HUB_OFFLINE
          value: "0"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: {{ .Values.modelServing.resources.requests.cpu | quote }}
          memory: {{ .Values.modelServing.resources.requests.memory | quote }}
        limits:
          cpu: {{ .Values.modelServing.resources.limits.cpu | quote }}
          memory: {{ .Values.modelServing.resources.limits.memory | quote }}
{{- end }}
