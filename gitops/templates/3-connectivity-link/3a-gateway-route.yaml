{{- if .Values.connectivityLink.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-gateway
  namespace: {{ .Values.modelServing.namespace }}
  labels:
    app.kubernetes.io/part-of: openshift-ai-ref
    app.kubernetes.io/managed-by: Helm
spec:
  host: "{{ .Values.connectivityLink.gateway.hostname }}.{{ .Values.ingressDomain }}"
  to:
    kind: Service
    name: ai-gateway-openshift-default
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
